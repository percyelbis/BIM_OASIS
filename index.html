<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Visor BIM · OSM</title>
    <style>
      :root {
        --bg: #f6f7f9;
        --surface: #ffffff;
        --text: #0f172a;
        --muted: #64748b;
        --line: rgba(15, 23, 42, 0.08);
        --accent: #2563eb;
        --accent-soft: rgba(37, 99, 235, 0.1);
        --radius: 14px;
        --shadow: 0 10px 30px rgba(15, 23, 42, 0.1), 0 1px 2px rgba(15, 23, 42, 0.06);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
        color: var(--text);
        background: var(--bg);
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }

      @supports (height: 100dvh) {
        html,
        body {
          height: 100dvh;
        }
      }

      button,
      .layer,
      .chip {
        touch-action: manipulation;
        -webkit-user-select: none;
        user-select: none;
      }

      #container {
        position: absolute;
        inset: 0;
      }

      #container canvas {
        display: block;
        touch-action: none;
      }

      /* ---------- Top bar ---------- */
      .topbar {
        position: fixed;
        top: 12px;
        left: 12px;
        right: 12px;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 8px 10px;
        background: rgba(255, 255, 255, 0.86);
        backdrop-filter: blur(16px) saturate(140%);
        -webkit-backdrop-filter: blur(16px) saturate(140%);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .brand-mark {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: linear-gradient(135deg, #2563eb, #1e40af);
        color: #fff;
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 15px;
        letter-spacing: -0.03em;
        flex-shrink: 0;
      }

      .brand-text {
        display: flex;
        flex-direction: column;
        line-height: 1.15;
        min-width: 0;
      }

      .brand-text strong {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      .brand-text span {
        font-size: 11.5px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 130px;
      }

      .top-actions {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
      }

      /* ---------- Buttons ---------- */
      button {
        font-family: inherit;
        cursor: pointer;
        border: none;
        background: none;
        color: inherit;
      }

      .icon-btn {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        background: #f1f5f9;
        color: #334155;
        font-size: 15px;
        transition: background 0.15s, color 0.15s;
      }

      .icon-btn:hover {
        background: #e2e8f0;
      }

      .icon-btn.ghost {
        background: transparent;
      }

      .btn-primary {
        height: 36px;
        padding: 0 14px;
        border-radius: 10px;
        background: var(--accent);
        color: #fff;
        font-size: 13px;
        font-weight: 600;
        white-space: nowrap;
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.28);
        transition: background 0.15s, transform 0.1s;
      }

      .btn-primary:active {
        transform: scale(0.97);
      }

      .btn-primary:hover {
        background: #1d4ed8;
      }

      /* ---------- Panel ---------- */
      .panel {
        position: fixed;
        z-index: 15;
        display: flex;
        flex-direction: column;
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(16px) saturate(140%);
        -webkit-backdrop-filter: blur(16px) saturate(140%);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 12px 6px 16px;
      }

      .panel-title {
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
      }

      .panel-body {
        overflow-y: auto;
        padding: 4px 16px 14px;
        -webkit-overflow-scrolling: touch;
      }

      .group {
        padding: 10px 0;
        border-top: 1px solid var(--line);
      }

      .group:first-child {
        border-top: none;
      }

      .group-label {
        font-size: 11.5px;
        font-weight: 600;
        color: var(--muted);
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .chip {
        padding: 7px 12px;
        border-radius: 9px;
        font-size: 12.5px;
        font-weight: 600;
        background: #f1f5f9;
        color: #475569;
        transition: all 0.15s;
      }

      .chip:hover {
        background: #e2e8f0;
      }

      .chip.active {
        background: var(--accent);
        color: #fff;
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
      }

      /* ---------- Layers ---------- */
      .layers {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .layer {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 7px 8px;
        border-radius: 9px;
        cursor: pointer;
        transition: background 0.12s;
        user-select: none;
      }

      .layer:hover {
        background: #f1f5f9;
      }

      .layer input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }

      .layer .dot {
        width: 10px;
        height: 10px;
        border-radius: 3px;
        flex-shrink: 0;
        transition: background 0.15s;
      }

      .layer .name {
        flex: 1;
        font-size: 13px;
        color: #334155;
      }

      .layer .count {
        font-size: 11px;
        color: #94a3b8;
        font-variant-numeric: tabular-nums;
      }

      .layer .swatch {
        width: 30px;
        height: 18px;
        border-radius: 999px;
        background: #e2e8f0;
        position: relative;
        flex-shrink: 0;
        transition: background 0.18s;
      }

      .layer .swatch::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.25);
        transition: transform 0.18s;
      }

      .layer input:checked + .swatch {
        background: var(--accent);
      }

      .layer input:checked + .swatch::after {
        transform: translateX(12px);
      }

      .layer.off .name {
        color: #94a3b8;
      }

      .layer.off .dot {
        opacity: 0.25;
      }

      .status {
        font-size: 11.5px;
        color: var(--muted);
        line-height: 1.4;
        padding-top: 10px;
        border-top: 1px solid var(--line);
      }

      .hint {
        font-size: 11px;
        color: #94a3b8;
        margin-top: 8px;
        line-height: 1.4;
      }

      /* ---------- FAB (móvil) ---------- */
      .fab {
        position: fixed;
        left: 14px;
        bottom: 18px;
        z-index: 16;
        width: 48px;
        height: 48px;
        border-radius: 16px;
        background: var(--accent);
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 19px;
        box-shadow: 0 10px 24px rgba(37, 99, 235, 0.35);
        display: none;
      }

      /* ---------- Popup propiedades ---------- */
      #geo-popup {
        position: fixed;
        z-index: 40;
        display: flex;
        flex-direction: column;
        background: rgba(255, 255, 255, 0.96);
        backdrop-filter: blur(18px) saturate(150%);
        -webkit-backdrop-filter: blur(18px) saturate(150%);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: 0 24px 60px rgba(15, 23, 42, 0.18);
        color: var(--text);
        overflow: hidden;
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 0.2s ease, transform 0.2s ease;
      }

      #geo-popup[hidden] {
        display: none;
      }

      #geo-popup.gp-visible {
        opacity: 1;
        transform: translateY(0);
      }

      .gp-header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 14px 10px;
        background: linear-gradient(135deg, rgba(37, 99, 235, 0.07), rgba(16, 185, 129, 0.05));
        border-bottom: 1px solid var(--line);
      }

      .gp-icon {
        width: 42px;
        height: 42px;
        min-width: 42px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 15px;
        color: #fff;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
      }

      .gp-titles {
        flex: 1;
        min-width: 0;
      }

      .gp-name {
        font-size: 14px;
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .gp-badges {
        display: flex;
        gap: 6px;
        margin-top: 5px;
        align-items: center;
        flex-wrap: wrap;
      }

      .gp-badge {
        font-size: 10.5px;
        font-weight: 700;
        padding: 2px 8px;
        border-radius: 999px;
        background: #f1f5f9;
        color: #475569;
      }

      .gp-gid {
        color: #94a3b8;
        font-family: ui-monospace, monospace;
        background: transparent;
        padding-left: 0;
        font-weight: 500;
      }

      .gp-close {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: #f1f5f9;
        color: #475569;
        font-size: 16px;
        display: grid;
        place-items: center;
        flex-shrink: 0;
      }

      .gp-close:hover {
        background: #e2e8f0;
      }

      .gp-geo {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
      }

      .gp-chip {
        background: #f8fafc;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 6px 8px;
        display: flex;
        flex-direction: column;
        gap: 1px;
        min-width: 0;
      }

      .gp-chip-label {
        font-size: 9.5px;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: #94a3b8;
        font-weight: 700;
      }

      .gp-chip-value {
        font-size: 11.5px;
        font-weight: 600;
        font-family: ui-monospace, monospace;
        color: #1e293b;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .gp-body {
        flex: 1;
        overflow: auto;
        padding: 6px;
        min-height: 120px;
        -webkit-overflow-scrolling: touch;
      }

      .gp-footer {
        display: flex;
        gap: 6px;
        padding: 10px 14px;
        border-top: 1px solid var(--line);
        background: #fcfdff;
      }

      .gp-btn {
        flex: 1;
        border: 1px solid var(--line);
        background: #fff;
        color: #334155;
        font-size: 12px;
        font-weight: 600;
        padding: 8px 6px;
        border-radius: 9px;
        white-space: nowrap;
      }

      .gp-btn:hover {
        background: #f1f5f9;
      }

      .gp-btn-accent {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }

      .gp-btn-accent:hover {
        background: #1d4ed8;
      }

      /* -------- Propiedades del elemento -------- */
      .prop-section {
        padding: 4px 0 6px;
      }

      .prop-section + .prop-section {
        border-top: 1px solid var(--line);
      }

      .prop-section-title {
        padding: 6px 10px 4px;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: #94a3b8;
      }

      .prop-row {
        display: grid;
        grid-template-columns: minmax(92px, 38%) 1fr;
        gap: 10px;
        padding: 5px 10px;
        align-items: start;
      }

      .prop-key {
        font-size: 11.5px;
        color: #64748b;
        overflow-wrap: anywhere;
      }

      .prop-value {
        font-size: 12px;
        font-weight: 600;
        color: #1e293b;
        overflow-wrap: anywhere;
        line-height: 1.35;
      }

      .prop-mono {
        font-family: ui-monospace, monospace;
        font-size: 11px;
        font-weight: 500;
      }

      .prop-details {
        border-top: 1px solid var(--line);
        padding: 2px 0 4px;
      }

      .prop-summary {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        cursor: pointer;
        list-style: none;
        user-select: none;
      }

      .prop-summary::-webkit-details-marker {
        display: none;
      }

      .prop-summary::before {
        content: "▸";
        font-size: 10px;
        color: #94a3b8;
        transition: transform 0.15s ease;
      }

      .prop-details[open] > .prop-summary::before {
        transform: rotate(90deg);
      }

      .prop-summary-name {
        flex: 1;
        min-width: 0;
        font-size: 11.5px;
        font-weight: 700;
        color: #334155;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .prop-summary-count {
        font-size: 10px;
        font-weight: 700;
        color: #64748b;
        background: #f1f5f9;
        border-radius: 999px;
        padding: 1px 7px;
      }

      .prop-list {
        padding-bottom: 2px;
      }

      .prop-empty {
        padding: 18px 12px;
        font-size: 12px;
        color: #94a3b8;
        text-align: center;
      }

      /* ---------- Loading ---------- */
      #loading {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: grid;
        place-items: center;
        background: rgba(246, 247, 249, 0.72);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        transition: opacity 0.3s ease;
      }

      #loading[hidden] {
        display: none;
      }

      .loading-card {
        width: min(380px, calc(100vw - 40px));
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 26px 24px 20px;
        box-shadow: 0 30px 70px rgba(15, 23, 42, 0.18);
        text-align: center;
      }

      .spinner {
        width: 38px;
        height: 38px;
        margin: 0 auto 14px;
        border-radius: 50%;
        border: 3px solid #e2e8f0;
        border-top-color: var(--accent);
        animation: spin 0.85s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .loading-title {
        font-size: 15px;
        font-weight: 700;
        color: var(--text);
      }

      .loading-sub {
        font-size: 12.5px;
        color: var(--muted);
        margin-top: 4px;
      }

      #loading-bar-wrap {
        margin-top: 16px;
        height: 7px;
        background: #eef2f7;
        border-radius: 999px;
        overflow: hidden;
      }

      #loading-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #2563eb, #22c55e);
        border-radius: 999px;
        transition: width 0.2s;
      }

      #loading-pct {
        font-size: 12px;
        font-weight: 700;
        color: #475569;
        margin-top: 8px;
        font-family: ui-monospace, monospace;
      }

      #loading-error {
        display: none;
        margin-top: 12px;
        color: #dc2626;
        font-size: 12.5px;
        line-height: 1.5;
        text-align: left;
      }

      /* ---------- Desktop ---------- */
      @media (min-width: 900px) {
        .topbar {
          top: 16px;
          left: 16px;
          right: 16px;
          padding: 10px 14px;
        }

        .brand-text span {
          max-width: 260px;
        }

        .panel {
          top: 86px;
          left: 16px;
          width: 272px;
          max-height: calc(100vh - 110px);
        }

        #geo-popup {
          top: 86px;
          right: 16px;
          width: 370px;
          max-height: calc(100vh - 110px);
        }

        .fab {
          display: none !important;
        }
      }

      /* Safari/iPad: altura real de la ventana visible. */
      @supports (height: 100dvh) {
        @media (min-width: 900px) {
          .panel {
            max-height: calc(100dvh - 110px);
          }

          #geo-popup {
            max-height: calc(100dvh - 110px);
          }
        }
      }

      /* ---------- Móvil / tablet ---------- */
      @media (max-width: 899px) {
        .topbar {
          top: max(8px, env(safe-area-inset-top));
          left: max(8px, env(safe-area-inset-left));
          right: max(8px, env(safe-area-inset-right));
          padding: 7px 8px;
        }

        .brand-mark {
          width: 30px;
          height: 30px;
          font-size: 13px;
        }

        .brand-text strong {
          font-size: 13px;
        }

        .brand-text span {
          max-width: 92px;
          font-size: 10.5px;
        }

        .btn-primary {
          height: 38px;
          padding: 0 12px;
          font-size: 12px;
        }

        .icon-btn {
          width: 38px;
          height: 38px;
          font-size: 15px;
        }

        .panel {
          left: max(8px, env(safe-area-inset-left));
          right: max(8px, env(safe-area-inset-right));
          bottom: max(8px, env(safe-area-inset-bottom));
          max-height: 68vh;
          max-height: 68dvh;
          transform: translateY(calc(100% + 20px));
          transition: transform 0.26s cubic-bezier(0.32, 0.72, 0, 1);
          border-radius: 18px;
          touch-action: pan-y;
        }

        .panel.open {
          transform: translateY(0);
        }

        .panel-body {
          overscroll-behavior: contain;
        }

        .chip {
          padding: 9px 13px;
          font-size: 13px;
        }

        .layer {
          padding: 9px 8px;
        }

        .layer .name {
          font-size: 13.5px;
        }

        .fab {
          display: grid;
          left: max(12px, env(safe-area-inset-left));
          bottom: max(16px, env(safe-area-inset-bottom));
          width: 52px;
          height: 52px;
          font-size: 21px;
        }

        .fab.hidden {
          display: none;
        }

        #geo-popup {
          left: max(8px, env(safe-area-inset-left));
          right: max(8px, env(safe-area-inset-right));
          bottom: max(8px, env(safe-area-inset-bottom));
          max-height: 62vh;
          max-height: 62dvh;
          border-radius: 18px;
        }

        .gp-body {
          overscroll-behavior: contain;
        }

        .gp-footer {
          padding-bottom: max(10px, env(safe-area-inset-bottom));
        }

        .gp-btn {
          padding: 11px 6px;
          font-size: 12.5px;
        }
      }

      @media (max-width: 899px) and (orientation: landscape) and (max-height: 520px) {
        .panel {
          max-height: 88vh;
          max-height: 88dvh;
        }

        #geo-popup {
          max-height: 88vh;
          max-height: 88dvh;
        }
      }

      /* Tablets y laptops táctiles (iPad, Surface, etc.) */
      @media (pointer: coarse) {
        .icon-btn {
          width: 40px;
          height: 40px;
        }

        .btn-primary {
          height: 40px;
        }

        .chip {
          padding: 9px 13px;
        }

        .layer {
          padding: 9px 8px;
        }
      }
    </style>
  </head>
  <body>
    <div id="container"></div>

    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">B</div>
        <div class="brand-text">
          <strong>Visor BIM</strong>
          <span id="model-name">Sin modelo</span>
        </div>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="btn-fit" title="Encuadrar modelo" aria-label="Encuadrar modelo">⤢</button>
        <button class="btn-primary" id="load-file">Cargar IFC</button>
      </div>
    </header>

    <aside class="panel" id="panel">
      <div class="panel-head">
        <span class="panel-title">Herramientas</span>
        <button class="icon-btn ghost" id="panel-close" aria-label="Cerrar panel">✕</button>
      </div>
      <div class="panel-body">
        <section class="group">
          <div class="group-label">Vistas</div>
          <div class="chips">
            <button class="chip active" data-view="iso">3D</button>
            <button class="chip" data-view="top">Planta</button>
            <button class="chip" data-view="front">Frente</button>
          </div>
        </section>

        <section class="group">
          <div class="group-label">
            <span>Capas</span>
            <span id="layers-count" class="count"></span>
          </div>
          <div class="layers" id="layers"></div>
        </section>

        <section class="group">
          <div class="group-label">Mapa base</div>
          <div class="chips">
            <button class="chip" data-map="none">Ninguno</button>
            <button class="chip active" data-map="osm">OpenStreetMap</button>
          </div>
          <div class="hint" id="geo-hint">Georreferencia UTM 19S · EPSG:32719</div>
        </section>

        <div class="status" id="status">Listo.</div>
      </div>
    </aside>

    <button class="fab" id="panel-open" aria-label="Abrir herramientas">☰</button>

    <div id="geo-popup" hidden>
      <div class="gp-header">
        <div class="gp-icon" id="gp-icon">?</div>
        <div class="gp-titles">
          <div class="gp-name" id="gp-name">—</div>
          <div class="gp-badges">
            <span class="gp-badge" id="gp-type">—</span>
            <span class="gp-badge gp-gid" id="gp-gid"></span>
          </div>
        </div>
        <button class="gp-close" id="gp-close" aria-label="Cerrar">✕</button>
      </div>
      <div class="gp-geo">
        <div class="gp-chip">
          <span class="gp-chip-label">Lat</span>
          <span class="gp-chip-value" id="gp-lat">—</span>
        </div>
        <div class="gp-chip">
          <span class="gp-chip-label">Lon</span>
          <span class="gp-chip-value" id="gp-lon">—</span>
        </div>
        <div class="gp-chip">
          <span class="gp-chip-label">Elev</span>
          <span class="gp-chip-value" id="gp-elev">—</span>
        </div>
      </div>
      <div class="gp-body" id="gp-body"></div>
      <div class="gp-footer">
        <button class="gp-btn" id="gp-copy">Copiar</button>
        <button class="gp-btn" id="gp-isolate">Aislar</button>
        <button class="gp-btn gp-btn-accent" id="gp-zoom">Zoom</button>
      </div>
    </div>

    <input type="file" id="file-input" accept=".ifc,application/octet-stream" hidden />

    <div id="loading" hidden>
      <div class="loading-card">
        <div class="spinner"></div>
        <div class="loading-title" id="loading-title">Cargando modelo IFC…</div>
        <div class="loading-sub" id="loading-sub">Convirtiendo a Fragments</div>
        <div id="loading-bar-wrap"><div id="loading-bar"></div></div>
        <div id="loading-pct">0%</div>
        <div id="loading-error"></div>
      </div>
    </div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
